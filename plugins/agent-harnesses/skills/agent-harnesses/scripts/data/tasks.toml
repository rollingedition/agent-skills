# The 20 maintenance tasks on the unitcraft case (notes/plan.md section 3).
# Issue texts are the plan's, verbatim, except T-08 and T-15, which the case build changed (see the build summary).
# check names a hidden file in examples/data/hidden/, or "" for a predicate-only check.

[[task]]
id = "T-01"
kind = "fix"
issue = """`format_quantity` drops the trailing zeros: 3.5 kg prints as `3.5 kg`, and the default is two places. CI is red on `tests/test_format.py`."""
check = "test_t01.py"
unchanged = ["tests"]

[[task]]
id = "T-02"
kind = "fix"
issue = """Negative amounts lose their thousands separator: `-1234.5 m` should print `-1,234.50 m`."""
check = "test_t02.py"
unchanged = ["tests"]

[[task]]
id = "T-03"
kind = "fix"
issue = """`parse_quantity('1,000 m')` raises ParseError. Commas in the whole-number part should be accepted, so `1,000 m` and `1,000.5 m` parse."""
check = "test_t03.py"
unchanged = ["tests"]

[[task]]
id = "T-04"
kind = "implement"
issue = """Add the inch: `in`, 0.0254 m. `parse_quantity('2 in')` should work, and `convert` should take it."""
check = "test_t04.py"
unchanged = ["tests"]

[[task]]
id = "T-05"
kind = "implement"
issue = """Add the yard: `yd`, 0.9144 m, with the same behaviour as the foot."""
check = "test_t05.py"
unchanged = ["tests"]

[[task]]
id = "T-06"
kind = "implement"
issue = """Add `sum_quantities(qs, unit)`: it converts each quantity to `unit` and adds them. An empty list gives zero in that unit. Mixing dimensions raises `IncompatibleUnitsError`."""
check = "test_t06.py"
unchanged = ["tests"]

[[task]]
id = "T-07"
kind = "implement"
issue = """Add `format_table(qs)`: one line per quantity, sorted by dimension, then unit, then value, with the numbers aligned on the decimal point. The layout is in the README."""
check = "test_t07.py"
unchanged = ["tests"]

[[task]]
id = "T-08"
kind = "fix"
issue = """`convert(parse_quantity('2 min'), 's')` raises UnknownUnitError instead of 120 s. The prefix split runs before the whole-unit lookup, so `min` is read as milli- plus `in`."""
check = "test_t08.py"
unchanged = ["tests"]

